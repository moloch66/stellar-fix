<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StellarFix — O Mecânico da Galáxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ═══════════════════════════════════════════════════════
   BASE / RESET
═══════════════════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

:root {
  --orange : #fb6b3c;
  --yellow : #f5c518;
  --green  : #00e676;
  --red    : #f44336;
  --blue   : #42a5f5;
  --cyan   : #00f5ff;
  --dark   : #070d1a;
  --panel  : rgba(6,10,24,0.92);
  --border : rgba(251,107,60,0.55);
  --font   : 'Press Start 2P', monospace;
}

html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #000;
  font-family: var(--font);
}

/* ═══════════════════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════════════════ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  transition: opacity 0.6s ease;
}

.screen.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Full-cover background images */
.bg-cover-img {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* ── Scanlines (pixel art feel) */
.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 2;
}

/* ── CRT vignette */
.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.72) 100%);
  pointer-events: none;
  z-index: 3;
}

/* ═══════════════════════════════════════════════════════
   SCREEN 1 — MAIN MENU
═══════════════════════════════════════════════════════ */
#screen-menu {
  align-items: center;
  justify-content: flex-end;
}

/* Fallback background for screen 1 if image not loaded */
#bg-menu {
  background-image: url('web-assets/bg1.jpg');
  background-color: #0d1420;
}

.menu-panel {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 40px;
  margin-right: 60px;
  gap: 0;
  background: rgba(4, 8, 20, 0.82);
  border: 3px solid rgba(0,245,255,0.2);
  border-left: 4px solid var(--cyan);
  box-shadow:
    8px 8px 0 rgba(0,0,0,0.8),
    0 0 40px rgba(0,245,255,0.08),
    inset 0 0 30px rgba(0,0,0,0.3);
  min-width: 320px;
}

.game-logo {
  font-size: 26px;
  color: var(--cyan);
  text-shadow:
    3px 3px 0 #003a5a,
    0 0 20px rgba(0,245,255,0.6),
    0 0 40px rgba(0,245,255,0.3);
  letter-spacing: 4px;
  margin-bottom: 4px;
  line-height: 1.3;
}

.game-sub {
  font-size: 7px;
  color: rgba(160,200,255,0.6);
  letter-spacing: 2px;
  margin-bottom: 32px;
  margin-top: 2px;
}

.menu-divider {
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), transparent);
  margin-bottom: 28px;
  opacity: 0.4;
}

.menu-btn {
  font-family: var(--font);
  font-size: 10px;
  letter-spacing: 2px;
  background: rgba(8,15,35,0.9);
  border: 2px solid rgba(0,245,255,0.25);
  border-left: 4px solid rgba(0,245,255,0.6);
  color: #9ac8f0;
  padding: 14px 28px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.8);
  transition: all 0.08s;
  margin-bottom: 8px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-btn::before {
  content: '▸';
  color: var(--cyan);
  font-size: 10px;
  opacity: 0.5;
  transition: opacity 0.1s;
}

.menu-btn:hover {
  background: rgba(0,245,255,0.1);
  border-color: var(--cyan);
  color: #fff;
  box-shadow: 6px 6px 0 rgba(0,0,0,0.8), 0 0 18px rgba(0,245,255,0.25);
  transform: translateX(6px);
}

.menu-btn:hover::before { opacity: 1; }

.menu-btn:active {
  transform: translate(3px,3px);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}

.menu-version {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-size: 7px;
  color: rgba(255,255,255,0.2);
  z-index: 10;
}

/* Star field overlay for menu */
#stars-canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* ═══════════════════════════════════════════════════════
   SCREEN 2 — WORKSHOP
═══════════════════════════════════════════════════════ */
#screen-workshop {
  flex-direction: row;
}

#bg-workshop {
  background-image: url('web-assets/bg2.jpg');
  background-color: #0d1015;
}

/* ── SIDEBAR ──────────────────────────────────────── */
.sidebar {
  position: relative;
  z-index: 30;
  width: 110px;
  flex-shrink: 0;
  background: rgba(5,8,20,0.96);
  border-right: 3px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 6px;
  gap: 6px;
  box-shadow: 6px 0 24px rgba(0,0,0,0.9), inset -4px 0 12px rgba(0,0,0,0.5);
}

.sidebar-logo {
  font-size: 7px;
  color: var(--orange);
  letter-spacing: 1px;
  padding: 6px 4px 10px;
  text-align: center;
  border-bottom: 2px solid rgba(251,107,60,0.3);
  width: 100%;
  line-height: 1.6;
}

.sidebar-logo span {
  display: block;
  font-size: 11px;
  color: var(--cyan);
  letter-spacing: 3px;
}

.sb-btn {
  width: 94px;
  height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: pointer;
  border: 3px solid rgba(80,100,160,0.35);
  background: rgba(12,18,40,0.9);
  transition: all 0.1s;
  font-size: 7px;
  color: #6080a0;
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
}

.sb-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 2px solid transparent;
  transition: border-color 0.1s;
}

.sb-btn:hover {
  background: rgba(25,38,80,0.95);
  border-color: var(--orange);
  color: #eee;
  box-shadow: 0 0 16px rgba(251,107,60,0.35), inset 0 0 12px rgba(251,107,60,0.08);
}

.sb-btn:hover::after {
  border-color: rgba(251,107,60,0.2);
}

.sb-btn.active {
  border-color: var(--orange);
  background: rgba(251,107,60,0.18);
  color: var(--orange);
  box-shadow: 0 0 20px rgba(251,107,60,0.45), inset 0 0 16px rgba(251,107,60,0.12);
}

.sb-btn .sb-icon {
  font-size: 26px;
  line-height: 1;
  filter: drop-shadow(0 0 4px currentColor);
}

.sb-btn .sb-label {
  font-size: 6.5px;
  letter-spacing: 1.5px;
}

.sb-separator {
  width: 80%;
  height: 1px;
  background: rgba(255,255,255,0.08);
}

/* Deliver button in sidebar */
.deliver-btn {
  width: 94px;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  margin-top: auto;
  border: 3px solid #ff7a45;
  background: linear-gradient(180deg, #c94e1a 0%, #8a2800 100%);
  color: #ffe8d0;
  font-family: var(--font);
  font-size: 6.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  box-shadow:
    0 0 20px rgba(251,107,60,0.6),
    5px 5px 0 rgba(0,0,0,0.8),
    inset 0 2px 0 rgba(255,150,80,0.3);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
  transition: all 0.1s;
  animation: deliverPulse 2.5s ease-in-out infinite;
  position: relative;
}

.deliver-btn .deliver-icon {
  font-size: 22px;
  filter: drop-shadow(0 0 6px #ff9060);
}

.deliver-btn .deliver-label {
  text-align: center;
  line-height: 1.6;
}

@keyframes deliverPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(251,107,60,0.6), 5px 5px 0 rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,150,80,0.3); }
  50%       { box-shadow: 0 0 35px rgba(251,107,60,0.9), 5px 5px 0 rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,150,80,0.3); }
}

.deliver-btn:hover {
  background: linear-gradient(180deg, #fb6b3c 0%, #b03800 100%);
  border-color: #ffa070;
  transform: translate(-2px,-2px);
  box-shadow:
    0 0 40px rgba(251,107,60,0.9),
    8px 8px 0 rgba(0,0,0,0.8),
    inset 0 2px 0 rgba(255,180,100,0.4);
}

.deliver-btn:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}

/* ── TOOL PANEL (slides from sidebar) ──────────────── */
.tool-panel {
  position: absolute;
  left: 110px;
  top: 0;
  bottom: 0;
  width: 210px;
  background: rgba(5,9,22,0.95);
  border-right: 2px solid rgba(100,140,220,0.25);
  padding: 16px 12px;
  z-index: 25;
  transform: translateX(-100%);
  transition: transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
  display: flex;
  flex-direction: column;
  gap: 0;
  box-shadow: 6px 0 20px rgba(0,0,0,0.7);
  overflow-y: auto;
}

.tool-panel.open {
  transform: translateX(0);
}

.tool-panel-header {
  font-size: 8px;
  color: var(--orange);
  letter-spacing: 2px;
  padding-bottom: 10px;
  border-bottom: 2px solid rgba(251,107,60,0.3);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tool-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.02);
  font-size: 7px;
  color: #7090b0;
  transition: all 0.1s;
  margin-bottom: 4px;
  position: relative;
}

.tool-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--orange);
  opacity: 0;
  transition: opacity 0.1s;
}

.tool-item:hover {
  background: rgba(251,107,60,0.08);
  color: #fff;
  border-color: rgba(251,107,60,0.3);
}

.tool-item:hover::before { opacity: 1; }

.tool-sep {
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin: 6px 0;
}

.prog-label {
  font-size: 6.5px;
  color: #5070a0;
  margin-bottom: 3px;
  letter-spacing: 1px;
}

.prog-bar {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}

.prog-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, #00b248, #00e676);
  box-shadow: 0 0 8px rgba(0,230,118,0.5);
  transition: width 0.6s;
}

/* ── HEADER BAR ─────────────────────────────────────── */
.ws-header {
  position: absolute;
  top: 0;
  left: 110px;
  right: 0;
  height: 48px;
  background: rgba(4,7,18,0.94);
  border-bottom: 2px solid rgba(251,107,60,0.3);
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 20;
  gap: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.7);
}

.header-tag {
  font-size: 7px;
  letter-spacing: 1px;
}

.header-tag .tag-label {
  color: rgba(255,255,255,0.35);
}

.header-tag .tag-value {
  color: var(--cyan);
}

.header-sep {
  width: 1px;
  height: 24px;
  background: rgba(255,255,255,0.1);
}

.star-row { display: flex; gap: 3px; }
.star-filled { color: var(--yellow); font-size: 12px; }
.star-empty  { color: rgba(255,255,255,0.15); font-size: 12px; }

/* ── SHIP ICONS (hotspots over the ship) ─────────────── */
.ship-icons-layer {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
}

/* ── SHIP ICON HOTSPOTS ─────────────────────────────── */
.ship-icon {
  position: absolute;
  width: 9.8%;
  height: 23%;
  cursor: pointer;
  pointer-events: all;
  background: transparent;
  border: 3px solid transparent;
  border-radius: 6px;
  font-size: 0;
  color: transparent;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

/* Hover sutil — mostra que é clicável sem revelar a zona */
.icon-wrench:hover  { border-color:rgba(255,144,96,0.45);  box-shadow:0 0 18px rgba(251,107,60,0.4); }
.icon-bolt:hover    { border-color:rgba(245,224,96,0.45);  box-shadow:0 0 18px rgba(245,197,24,0.4); }
.icon-monitor:hover { border-color:rgba(96,240,160,0.45);  box-shadow:0 0 18px rgba(0,230,118,0.4); }
.icon-robot:hover   { border-color:rgba(255,96,96,0.45);   box-shadow:0 0 18px rgba(244,67,54,0.4); }
.icon-rocket:hover  { border-color:rgba(112,184,255,0.45); box-shadow:0 0 18px rgba(66,165,245,0.4); }

/* Estado selecionado — glow pulsante colorido */
.icon-wrench.selected  { border-color:#ff9060; background:rgba(251,107,60,0.13); box-shadow:0 0 28px rgba(251,107,60,0.9),0 0 8px rgba(251,107,60,0.5) inset; animation:selPulse-orange 1.3s ease-in-out infinite; }
.icon-bolt.selected    { border-color:#f5e060; background:rgba(245,197,24,0.13); box-shadow:0 0 28px rgba(245,197,24,0.95),0 0 8px rgba(245,197,24,0.5) inset; animation:selPulse-yellow 1.3s ease-in-out infinite; }
.icon-monitor.selected { border-color:#60f0a0; background:rgba(0,230,118,0.13); box-shadow:0 0 28px rgba(0,230,118,0.9),0 0 8px rgba(0,230,118,0.5) inset;  animation:selPulse-green  1.3s ease-in-out infinite; }
.icon-robot.selected   { border-color:#ff6060; background:rgba(244,67,54,0.13);  box-shadow:0 0 28px rgba(244,67,54,0.9),0 0 8px rgba(244,67,54,0.5) inset;   animation:selPulse-red    1.3s ease-in-out infinite; }
.icon-rocket.selected  { border-color:#70b8ff; background:rgba(66,165,245,0.13); box-shadow:0 0 28px rgba(66,165,245,0.9),0 0 8px rgba(66,165,245,0.5) inset; animation:selPulse-blue   1.3s ease-in-out infinite; }

@keyframes selPulse-orange { 0%,100%{box-shadow:0 0 22px rgba(251,107,60,0.7) } 50%{box-shadow:0 0 40px rgba(251,107,60,1),0 0 12px rgba(255,180,120,0.6) inset} }
@keyframes selPulse-yellow { 0%,100%{box-shadow:0 0 22px rgba(245,197,24,0.7) } 50%{box-shadow:0 0 40px rgba(245,197,24,1),0 0 12px rgba(255,240,120,0.6) inset} }
@keyframes selPulse-green  { 0%,100%{box-shadow:0 0 22px rgba(0,230,118,0.7)  } 50%{box-shadow:0 0 40px rgba(0,230,118,1), 0 0 12px rgba(100,255,180,0.6) inset} }
@keyframes selPulse-red    { 0%,100%{box-shadow:0 0 22px rgba(244,67,54,0.7)  } 50%{box-shadow:0 0 40px rgba(244,67,54,1), 0 0 12px rgba(255,130,120,0.6) inset} }
@keyframes selPulse-blue   { 0%,100%{box-shadow:0 0 22px rgba(66,165,245,0.7) } 50%{box-shadow:0 0 40px rgba(66,165,245,1),0 0 12px rgba(150,210,255,0.6) inset} }

.icon-tooltip { display:none; }

/* ── SIDEBAR ACTIVE UPGRADE ─────────────────────────── */
.sb-btn.active {
  border-color: var(--orange);
  background: rgba(251,107,60,0.18);
  color: var(--orange);
  animation: sbPulse 1.3s ease-in-out infinite;
}
@keyframes sbPulse {
  0%,100% { box-shadow:0 0 16px rgba(251,107,60,0.4),inset 0 0 10px rgba(251,107,60,0.08); }
  50%     { box-shadow:0 0 32px rgba(251,107,60,0.85),inset 0 0 18px rgba(251,107,60,0.18); }
}

/* ── DELIVER BTN UPGRADE ─────────────────────────────── */
.deliver-btn {
  animation: deliverGlow 2s ease-in-out infinite !important;
}
@keyframes deliverGlow {
  0%,100% { box-shadow:0 0 20px rgba(251,107,60,0.6),5px 5px 0 rgba(0,0,0,0.8),inset 0 2px 0 rgba(255,150,80,0.3); transform:scale(1); }
  50%     { box-shadow:0 0 40px rgba(251,107,60,1),  5px 5px 0 rgba(0,0,0,0.8),inset 0 2px 0 rgba(255,180,100,0.5); transform:scale(1.03); }
}

/* ── PANEL SLIDE UPGRADE ─────────────────────────────── */
.tool-panel {
  transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
}

/* ── HEADER GLOW TAGS ────────────────────────────────── */
.tag-value {
  text-shadow: 0 0 8px currentColor;
}

/* ── PROGRESS BAR SHIMMER ────────────────────────────── */
.prog-fill::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.35) 50%,transparent 100%);
  animation:shimmer 2s ease-in-out infinite;
  background-size:200% 100%;
}
@keyframes shimmer {
  0%  { background-position:200% 0; }
  100%{ background-position:-200% 0; }
}

/* ── NPC BUBBLE TYPING CURSOR ────────────────────────── */
.speech-bubble::after {
  content:'';
  position:absolute;
  bottom:-16px;
  left:20px;
  border:8px solid transparent;
  border-top-color:#1a2a4a;
}
.speech-bubble::before {
  content:'';
  position:absolute;
  bottom:-11px;
  left:22px;
  border:6px solid transparent;
  border-top-color:rgba(220,235,255,0.96);
  z-index:1;
}

/* ── NPC MECHANIC ────────────────────────────────────── */
.npc-area {
  position: absolute;
  bottom: 0;
  left: 114px;
  z-index: 22;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-left: 8px;
  padding-bottom: 0;
  pointer-events: none;
}

.speech-bubble {
  background: rgba(220,235,255,0.96);
  border: 3px solid #1a2a4a;
  border-radius: 4px;
  padding: 10px 14px;
  margin-bottom: 10px;
  min-width: 180px;
  max-width: 220px;
  font-size: 6.5px;
  color: #1a1a2e;
  line-height: 2;
  position: relative;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
  animation: bubbleWobble 4s ease-in-out infinite;
  transition: opacity 0.4s;
}

@keyframes bubbleWobble {
  0%,100% { transform: rotate(-0.5deg); }
  50%      { transform: rotate(0.5deg); }
}

.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -16px;
  left: 20px;
  border: 8px solid transparent;
  border-top-color: #1a2a4a;
}

.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -11px;
  left: 22px;
  border: 6px solid transparent;
  border-top-color: rgba(220,235,255,0.96);
  z-index: 1;
}

.npc-img {
  height: 320px;
  width: auto;
  object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.8));
  animation: npcIdle 2.5s ease-in-out infinite;
}

@keyframes npcIdle {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

/* Fallback NPC (CSS pixel art character) when no image */
.npc-fallback {
  width: 80px;
  height: 200px;
  position: relative;
  animation: npcIdle 2.5s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════
   PARTICLE CANVAS
═══════════════════════════════════════════════════════ */
#pfx-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}

/* ═══════════════════════════════════════════════════════
   TRANSITION OVERLAY
═══════════════════════════════════════════════════════ */
#transition-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 99999;
  transition: opacity 0.4s;
}

/* ═══════════════════════════════════════════════════════
   NOTIFICATION TOAST
═══════════════════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;

// ── STARS BACKGROUND (fallback for menu) ─────────────
(function initStars() {
  const c   = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];

  function resize() {
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x  : Math.random() * c.width,
        y  : Math.random() * c.height,
        r  : Math.random() * 1.5 + 0.3,
        a  : Math.random(),
        sp : Math.random() * 0.004 + 0.001,
        vx : (Math.random() - 0.5) * 0.12,
      });
    }
  }

  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s => {
      s.a  += s.sp;
      s.x  += s.vx;
      if (s.x < 0)       s.x = c.width;
      if (s.x > c.width) s.x = 0;
      const alpha = (Math.sin(s.a) * 0.4 + 0.6);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(180,220,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

  setTimeout(() => {
    callback();
    setTimeout(() => {
      ov.style.opacity = '0';
      setTimeout(() => { ov.style.pointerEvents = 'none'; }, 400);
    }, 80);
  }, 380);
}

    const s = timerSecs % 60;
    const el = document.getElementById('timer-display');
    if (el) {
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.style.color = timerSecs < 60 ? 'var(--red)' : (timerSecs < 120 ? 'var(--orange)' : 'var(--yellow)');

  }, 1000);
}

// ── SHIP ICON SELECTION ───────────────────────────────
let selectedIcon = null;

function selectIcon(el, type, event) {
  // Remove selected de todos
  document.querySelectorAll('.ship-icon').forEach(i => i.classList.remove('selected','flash'));
  // Se mesmo clicado novamente → deselect
  if (selectedIcon === el) { selectedIcon = null; return; }
  // Aplica selected + flash de entrada
  el.classList.add('selected');
  selectedIcon = el;
  triggerEffect(type, event);
}

// ── OPEN TOOL PANEL ───────────────────────────────────
let currentPanel = null;

function openPanel(key, btnEl) {
  const panel = document.getElementById('tool-panel');
  const data  = panelData[key];

  // Deactivate all sidebar buttons
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));

  if (currentPanel === key) {
    // Close if same panel clicked again
    panel.classList.remove('open');
    currentPanel = null;
    return;
  }

  // Activate pressed button
  if (btnEl) btnEl.classList.add('active');

  // Fill content
  document.getElementById('panel-icon').textContent  = data.icon;
  document.getElementById('panel-title').textContent = data.title;
  document.getElementById('panel-content').innerHTML = data.html;

  panel.classList.add('open');
  currentPanel = key;
}

// ── TYPEWRITER EFFECT ─────────────────────────────────
function typewriter(el, html, speed = 38) {
  const text = html.replace(/<br>/g, '\n');
  el.textContent = '';
  let i = 0;
  const tick = () => {
    if (i >= text.length) return;
    const ch = text[i++];
    if (ch === '\n') el.appendChild(document.createElement('br'));
    else el.appendChild(document.createTextNode(ch));
    setTimeout(tick, speed);
  };
  tick();
}

    bubble.style.transform = 'scale(0.93) translateY(4px)';
    bubble.style.transition = 'opacity 0.3s, transform 0.3s';
    setTimeout(() => {
      bubble.textContent = '';
      bubble.style.opacity = '1';
      bubble.style.transform = '';
      typewriter(bubble, npcLines[npcIdx].replace(/\n/g,'<br>'), 42);
    }, 320);
  }
}, 5000);

/* ═══════════════════════════════════════════════════════
   PARTICLE EFFECTS ENGINE
═══════════════════════════════════════════════════════ */
const pfxCanvas = document.getElementById('pfx-canvas');
const pfxCtx    = pfxCanvas.getContext('2d');
let particles   = [];
let pfxRAF      = null;

function resizePfx() {
  pfxCanvas.width  = window.innerWidth;
  pfxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizePfx);
resizePfx();

// Particle classes per effect
const EFFECTS = {
  // 🔧 WRENCH — orange spark burst
  wrench: {
    color : () => `hsl(${20 + Math.random()*30}, 100%, ${50+Math.random()*30}%)`,
    count : 28,
    create: (x,y,i) => ({
      x, y,
      vx : (Math.random()-0.5)*9,
      vy : (Math.random()-0.5)*9 - 3,
      life: 1, decay: 0.025 + Math.random()*0.02,
      size: 3 + Math.random()*4,
      shape: 'square',
      color: `hsl(${20+Math.random()*30},100%,${50+Math.random()*30}%)`,
      gravity: 0.18,
      type: 'spark'
    }),
    draw(ctx, p) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle   = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.restore();
    }
  },

  // ⚡ BOLT — yellow electric arcs
  bolt: {
    color : () => `hsl(${50+Math.random()*20}, 100%, ${70+Math.random()*20}%)`,
    count : 20,
    create: (x,y,i) => ({
      x, y,
      angle : (i / 20) * Math.PI * 2,
      len   : 20 + Math.random()*30,
      life  : 1, decay: 0.04,
      color : `hsl(${50+Math.random()*20},100%,${70+Math.random()*20}%)`,
      width : 1.5 + Math.random()*1.5,
      type  : 'arc'
    }),
    draw(ctx, p) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.strokeStyle = p.color;
      ctx.lineWidth   = p.width;
      ctx.shadowColor = p.color;
      ctx.shadowBlur  = 8;
      const endX = p.x + Math.cos(p.angle) * p.len * (1 - p.life + 1);
      const endY = p.y + Math.sin(p.angle) * p.len * (1 - p.life + 1);
      // Zigzag
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      const midX = (p.x + endX)/2 + (Math.random()-0.5)*20;
      const midY = (p.y + endY)/2 + (Math.random()-0.5)*20;
      ctx.lineTo(midX, midY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.restore();
    }
  },

  // 🖥️ MONITOR — green scan beam rings
  monitor: {
    color : () => `hsl(${140+Math.random()*30}, 100%, ${50+Math.random()*20}%)`,
    count : 5,
    create: (x,y,i) => ({
      x, y,
      radius: 4 + i * 14,
      life  : 1, decay: 0.022 + i * 0.008,
      color : `hsl(${140+Math.random()*30},100%,${50+Math.random()*20}%)`,
      width : 3 - i * 0.4,
      type  : 'ring'
    }),
    draw(ctx, p) {
      ctx.save();
      ctx.globalAlpha = p.life * 0.9;
      ctx.strokeStyle = p.color;
      ctx.lineWidth   = Math.max(0.5, p.width * p.life);
      ctx.shadowColor = p.color;
      ctx.shadowBlur  = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * (1.6 - p.life), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  },

  // 🤖 ROBOT — red gear-spin particles
  robot: {
    color : () => `hsl(${0+Math.random()*25}, 90%, ${50+Math.random()*20}%)`,
    count : 24,
    create: (x,y,i) => ({
      x, y,
      angle : (i/24)*Math.PI*2,
      speed : 2.5 + Math.random()*3,
      life  : 1, decay: 0.018 + Math.random()*0.015,
      color : `hsl(${Math.random()*25},90%,${50+Math.random()*20}%)`,
      size  : 4 + Math.random()*3,
      rot   : Math.random()*Math.PI*2,
      rotSpd: (Math.random()-0.5)*0.3,
      type  : 'gear'
    }),
    draw(ctx, p) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x + Math.cos(p.angle)*p.speed*(1-p.life)*60,
                    p.y + Math.sin(p.angle)*p.speed*(1-p.life)*60);
      ctx.rotate(p.rot + p.rotSpd * (1-p.life)*60);
      ctx.fillStyle   = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur  = 8;
      // Draw gear-like hex
      ctx.beginPath();
      for (let j=0;j<6;j++){
        const a=j*Math.PI/3;
        j===0 ? ctx.moveTo(Math.cos(a)*p.size, Math.sin(a)*p.size)
              : ctx.lineTo(Math.cos(a)*p.size, Math.sin(a)*p.size);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  },

  // 🚀 ROCKET — blue bubble trail
  rocket: {
    color : () => `hsl(${200+Math.random()*40}, 90%, ${60+Math.random()*20}%)`,
    count : 22,
    create: (x,y,i) => ({
      x : x + (Math.random()-0.5)*30,
      y : y + (Math.random()-0.5)*30,
      vy: -(1 + Math.random()*4),
      vx: (Math.random()-0.5)*2.5,
      life: 1, decay: 0.016 + Math.random()*0.02,
      color: `hsl(${200+Math.random()*40},90%,${60+Math.random()*20}%)`,
      r    : 5 + Math.random()*10,
      type : 'bubble'
    }),
    draw(ctx, p) {
      ctx.save();
      ctx.globalAlpha = p.life * 0.7;
      ctx.strokeStyle = p.color;
      ctx.lineWidth   = 2;
      ctx.shadowColor = p.color;
      ctx.shadowBlur  = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.stroke();
      // Inner highlight
      ctx.globalAlpha = p.life * 0.2;
      ctx.fillStyle   = p.color;
      ctx.fill();
      ctx.restore();
    }
  }
};

// Map type → draw function (set at particle creation)
const TYPE_DRAW = {};
for (const [key, eff] of Object.entries(EFFECTS)) {
  const sample = eff.create(0, 0, 0);
  TYPE_DRAW[sample.type] = eff.draw.bind(eff);
}

function triggerEffect(type, event) {
  const x = event.clientX;
  const y = event.clientY;
  const def = EFFECTS[type];
  if (!def) return;

  for (let i = 0; i < def.count; i++) {
    particles.push(def.create(x, y, i));
  }

  if (!pfxRAF) pfxLoop();
}

function pfxLoop() {
  pfxCtx.clearRect(0, 0, pfxCanvas.width, pfxCanvas.height);

  particles = particles.filter(p => {
    p.life -= p.decay;
    if (p.life <= 0) return false;

    // Physics
    if (p.type === 'spark') {
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += p.gravity;
    } else if (p.type === 'gear') {
      p.y  += p.vy;
      p.x  += p.vx;
      p.vy += p.gravity;
    } else if (p.type === 'bubble') {
      p.x  += p.vx;
      p.y  += p.vy;
    }
    // arc & ring: position is static, drawn relative to origin

    const drawFn = TYPE_DRAW[p.type];
    if (drawFn) drawFn(pfxCtx, p);
    return true;
  });

  if (particles.length > 0) {
    pfxRAF = requestAnimationFrame(pfxLoop);
  } else {
    pfxRAF = null;
  }
}

// ── CONFETTI for ENTREGAR NAVE ────────────────────────
function spawnConfetti(cx, cy) {
  const colors = ['#fb6b3c','#f5c518','#00e676','#f44336','#42a5f5','#ce93d8','#fff'];
  for (let i = 0; i < 80; i++) {
    const col = colors[Math.floor(Math.random()*colors.length)];
    particles.push({
      x  : cx + (Math.random()-0.5)*200,
      y  : cy,
      vx : (Math.random()-0.5)*12,
      vy : -(4 + Math.random()*10),
      life  : 1,
      decay : 0.008 + Math.random()*0.012,
      color : col,
      size  : 6 + Math.random()*8,
      rot   : Math.random()*Math.PI*2,
      rotSpd: (Math.random()-0.5)*0.2,
      gravity: 0.22,
      type  : 'gear'
    });
  }
  if (!pfxRAF) pfxLoop();
}
